<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090A14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MW Play">
    <meta name="description" content="MW Play — seu mundo em streaming">
    <link rel="icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.faviconsPath %>/favicon.ico">
    <title>MW Play — Seu mundo em streaming</title>
    <style>
        :root {
            --primary-background-color: #080913 !important;
            --secondary-background-color: #11132a !important;
            --primary-accent-color: #8b35ff !important;
            --secondary-accent-color: #3f9cff !important;
            --modal-background-color: #0e1020 !important;
            --overlay-color: rgba(255,255,255,.075) !important;
            --outer-glow: 0 0 24px rgba(139,53,255,.34) !important;
            --border-radius: .9rem !important;
        }
        html, body, #app { background-color: #080913; }
        body {
            background:
                radial-gradient(circle at 88% 8%, rgba(68,90,255,.18), transparent 30%),
                radial-gradient(circle at 12% 92%, rgba(154,45,255,.13), transparent 35%),
                linear-gradient(135deg, #080913 0%, #0c0d1b 52%, #11132a 100%) !important;
        }
        button, a, [role="button"] { transition: transform .16s ease, filter .16s ease, background-color .16s ease; }
        button:hover, a:hover, [role="button"]:hover { filter: brightness(1.08); }
        img { border-radius: .7rem; }
        ::selection { background: rgba(139,53,255,.55); color: #fff; }
    </style>
    <%= htmlWebpackPlugin.tags.headTags %>
</head>

<body>
    <div id="app"></div>
    <%= htmlWebpackPlugin.tags.bodyTags %>
    <script src="//www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script async src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
</body>

</html>
